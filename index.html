<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="用真实经历帮助识己报告更贴近你在现实生活中的表现。">
  <meta name="theme-color" content="#f7f4ed">
  <title>识己｜现实校准信息表</title>
  <style>
    :root{--ink:#25322e;--muted:#6f7772;--paper:#f7f4ed;--line:#ded9ce;--jade:#315f52;--jade-soft:#e9f0eb;--gold:#a88245}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 8%,#f0e9dc 0,transparent 28%),var(--paper);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}button,textarea{font:inherit}button{color:inherit}.page-shell{min-height:100svh;padding:24px}.brand-bar{width:min(920px,100%);margin:0 auto 34px;display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--jade);font-family:serif;font-size:20px}.eyebrow,.brand-title{margin:0}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.14em}.brand-title{font-size:15px;font-weight:600}.save-state{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.save-state i{width:7px;height:7px;border-radius:50%;background:#5b8a72;box-shadow:0 0 0 4px #e7eee9}.card{width:min(760px,100%);margin:0 auto;padding:clamp(28px,6vw,64px);border:1px solid rgba(168,130,69,.25);border-radius:28px;background:rgba(255,253,248,.94);box-shadow:0 24px 80px rgba(58,51,40,.08)}.kicker,.section-number{margin:0 0 16px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.12em}h1{margin:0;font-family:"Songti SC",STSong,serif;font-size:clamp(30px,6vw,48px);line-height:1.2;font-weight:600;letter-spacing:.02em}.form-card h1{font-size:clamp(26px,4vw,36px)}.lead{max-width:610px;margin:24px 0 34px;color:#59625e;font-size:17px;line-height:1.9}.intro-copy{margin:-8px 0 30px;padding:18px 20px;border-left:2px solid var(--gold);color:#69716d;background:#faf7f0;font-size:14px;line-height:1.8}.intro-copy p{margin:0}.notice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:34px}.notice-grid div{padding:18px;border:1px solid var(--line);border-radius:16px;background:#faf8f2}.notice-grid strong,.notice-grid span{display:block}.notice-grid strong{margin-bottom:8px;font-size:14px}.notice-grid span{color:var(--muted);font-size:12px;line-height:1.55}.primary{min-height:50px;padding:0 28px;border:0;border-radius:999px;color:#fff;background:var(--jade);font-weight:650;cursor:pointer;box-shadow:0 8px 24px rgba(49,95,82,.18)}.primary span{margin-left:12px}.hero-button{min-width:180px}.privacy-note{margin:22px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress-track{height:3px;margin:10px 0 40px;border-radius:2px;overflow:hidden;background:#e6e1d8}.progress-track span{display:block;height:100%;background:var(--gold)}.helper{margin:14px 0 28px;color:var(--muted);font-size:14px}.choice-count{margin:-12px 0 10px;color:var(--muted);font-size:12px;text-align:right}.option-list{display:grid;gap:10px}.option-card{width:100%;min-height:62px;display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:12px;padding:12px 18px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fffefa;cursor:pointer}.option-card.active{border-color:var(--jade);background:var(--jade-soft)}.option-card.disabled{opacity:.48;cursor:not-allowed}.option-letter{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--jade);background:#edf0eb;font-size:12px;font-weight:700}.check{color:var(--jade);font-weight:800}.text-field{position:relative;display:block;margin-top:30px}.field-label{display:block;margin-bottom:8px;font-size:15px;font-weight:650}.field-label em{margin-left:8px;padding:3px 8px;border-radius:999px;color:var(--muted);background:#efede7;font-size:10px;font-style:normal;font-weight:500}.field-hint{display:block;margin:-3px 0 10px;color:var(--muted);font-size:12px;line-height:1.6}.text-field textarea{width:100%;min-height:130px;resize:vertical;padding:17px 18px 32px;border:1px solid var(--line);border-radius:16px;outline:none;color:var(--ink);background:#fffefa;font-size:15px;line-height:1.8}.text-field textarea:focus{border-color:#7e9a8e;box-shadow:0 0 0 4px rgba(49,95,82,.08)}.text-field textarea::placeholder{color:#aaa9a2}.char-count{position:absolute;right:13px;bottom:11px;color:#9a9b95;font-size:11px}.prompt-box{margin:24px 0 8px;padding:16px 18px;border-radius:14px;color:#626b67;background:#f3f0e9;font-size:13px;line-height:1.75}.subheading{margin:34px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}.subheading h2{margin:0 0 4px;font-family:"Songti SC",STSong,serif;font-size:20px}.subheading p{margin:0;color:var(--muted);font-size:12px}.form-actions{margin-top:34px;display:flex;justify-content:space-between;align-items:center}.text-button{border:0;background:transparent;color:var(--muted);cursor:pointer}.skip-link{display:block;margin:22px auto 0;border:0;border-bottom:1px solid #cac6bd;color:var(--muted);background:transparent;font-size:12px;cursor:pointer}.review-list{display:grid;gap:8px}.review-list button{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;text-align:left;background:#fffefa;cursor:pointer}.review-list button>span{color:var(--gold);font-size:11px}.review-list button div{min-width:0}.review-list strong,.review-list small{display:block}.review-list strong{margin-bottom:3px;font-size:14px}.review-list small{overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.review-list b{color:var(--jade);font-size:11px}.export-panel{margin-top:30px;padding:24px;border:1px solid #c9d6cf;border-radius:18px;text-align:center;background:var(--jade-soft)}.export-panel p{margin:0 auto 18px;max-width:530px;color:#586a63;font-size:13px;line-height:1.7}.export-button{min-width:230px}.export-notice{display:block;margin-top:12px;color:var(--jade);font-size:12px}.review-actions{display:flex;justify-content:space-between;margin-top:28px}.danger-link{border:0;background:transparent;color:#96635a;font-size:12px;cursor:pointer}
    @media(max-width:640px){.page-shell{padding:16px}.brand-bar{margin-bottom:18px}.save-state{display:none}.card{padding:28px 20px;border-radius:22px}.notice-grid{grid-template-columns:1fr}.notice-grid div{display:grid;grid-template-columns:124px 1fr;align-items:center}.notice-grid strong{margin:0}.primary{width:100%}.form-actions{position:sticky;bottom:10px;z-index:2;margin-left:-8px;margin-right:-8px;padding:10px 8px;border-radius:999px;background:rgba(255,253,248,.95);box-shadow:0 8px 28px rgba(35,45,41,.1);backdrop-filter:blur(12px)}.form-actions .primary{width:auto}.form-actions .text-button{padding:12px}.option-card{padding:12px 13px}.export-button{min-width:0}.review-list small{max-width:210px}.review-actions{gap:12px;align-items:center}.danger-link{text-align:right}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="brand-bar"><div class="brand-mark">识</div><div><p class="eyebrow">刘迷糊 · 识己</p><p class="brand-title">现实校准信息表</p></div><span class="save-state"><i></i> 已自动保存在当前设备</span></header>
    <div id="app"></div>
  </main>
  <script>
  (()=>{
    'use strict';
    const KEY='shiji-reality-calibration-v1';
    const O={
      focus:[['A','更清楚地认识自己的特点与反复模式'],['B','理解自己的优势、能力与发挥条件'],['C','事业、学习或专业发展'],['D','财富、资源与投入回报'],['E','合作、沟通与个人边界'],['F','亲密关系或家庭互动'],['G','压力、情绪与恢复方式'],['H','行动力、持续性与生活节奏'],['I','当前正在经历的选择或阶段变化']],
      complex:[['A','先理解整体结构和问题原理'],['B','先收集足够的信息，再作判断'],['C','先确定目标、标准和风险边界'],['D','先与相关的人讨论，补充不同视角'],['E','先做一个小范围尝试，再根据结果调整'],['F','先开始行动，在过程中逐步理清'],['G','根据过往经验迅速判断，再检查是否需要修正']],
      invest:[['A','能够自己决定方向和方式'],['B','能感受到自己不断掌握和进步'],['C','能做出具体、看得见的结果'],['D','得到认可、信任或积极反馈'],['E','对他人或某件重要的事有价值'],['F','能与认同的人共同完成'],['G','有清楚的规则、预期和稳定感'],['H','有新鲜感、变化或探索空间'],['I','有明确的现实回报'],['J','能表达自己的观点或创造新的东西']],
      lose:[['A','长期看不到进展或结果'],['B','缺少自主空间，处处受到限制'],['C','目标和标准反复变化'],['D','任务重复，缺少新的挑战'],['E','责任很多，但资源或权限不足'],['F','人际关系消耗过大'],['G','努力长期得不到认可或回报'],['H','不认同事情本身的意义'],['I','需要长期独自承担，缺少支持']],
      pressure:[['A','立即分析问题并寻找解决办法'],['B','反复思考细节，暂时难以停止'],['C','先压住感受，把该做的事情完成'],['D','暂时退出现场，减少交流和刺激'],['E','找信任的人讨论或寻求支持'],['F','通过运动、娱乐、睡眠等方式转移注意'],['G','情绪会先明显表现出来，之后再处理问题'],['H','身体会先出现疲惫、紧绷、失眠或食欲变化']],
      positive:[['A','理解快，能够看清问题'],['B','思路清楚，善于分析和整理'],['C','有想法，能够提出新的方案'],['D','执行力强，能够把事情推进'],['E','可靠，答应的事情会尽量完成'],['F','细致，容易发现别人忽略的问题'],['G','独立，有自己的判断'],['H','善于表达、讲解或影响他人'],['I','能理解他人，愿意照顾关系'],['J','能协调不同的人和资源'],['K','面对变化或压力时反应较快'],['L','有耐心，能够长期深入一件事']],
      friction:[['A','想得太多，决定得比较慢'],['B','标准较高，对自己或他人要求较多'],['C','表达直接，容易忽略对方的感受'],['D','不容易说出自己的真实需要'],['E','容易承担过多，不太会拒绝'],['F','坚持自己的判断，不容易被说服'],['G','遇到冲突时倾向暂时回避'],['H','开始得快，但后续容易失去兴趣'],['I','在意细节，容易影响整体推进'],['J','状态和效率容易受到环境影响']],
      relationship:[['A','先把事实、逻辑和责任讲清楚'],['B','先了解彼此的感受和真实需要'],['C','尽快寻找双方都能接受的方案'],['D','当下减少冲突，等情绪稳定后再谈'],['E','先反思自己是否需要承担责任'],['F','明确表达自己的立场和边界'],['G','希望对方主动理解，不太容易直接开口'],['H','根据关系的重要程度决定坚持还是退让'],['I','寻求可信任的第三方帮助梳理']]
    };
    const meta=[['关注重点','你最希望这份报告重点回应什么？'],['此刻的自我理解','现在的你怎样理解自己？'],['现实验证','哪项能力已经在现实中得到验证？'],['处理复杂问题','面对复杂或不确定的问题，你通常从哪里开始？'],['持续投入','什么让你愿意持续投入？'],['压力与恢复','压力来临时，你最先出现什么反应？'],['长期推进','你通常怎样把一件事持续做下去？'],['他人反馈','别人通常怎样评价你？'],['关系与边界','在重要关系中出现分歧时，你通常怎样处理？'],['转折与变化','哪些经历改变了你对自己的认识？']];
    const blank={focus:[],focusQuestion:'',selfThree:'',selfImportant:'',abilityEvidence:'',complex:[],complexCase:'',invest:[],lose:[],investExample:'',pressure:[],pressureExperience:'',longTerm:'',positive:[],friction:[],feedbackExample:'',relationship:[],relationshipUnderstand:'',relationshipNeed:'',relationshipSpace:'',turningPoints:''};
    let answers=load(),screen='welcome',step=0,notice='';
    const app=document.getElementById('app');
    function load(){try{return {...blank,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(_){return {...blank}}}
    function save(){localStorage.setItem(KEY,JSON.stringify(answers))}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function answered(){return Object.values(answers).filter(v=>Array.isArray(v)?v.length:String(v).trim()).length}
    function choices(name,max){const selected=answers[name]||[];return `<div class="choice-count">已选择 ${selected.length}/${max}</div><div class="option-list">${O[name].map(([c,t])=>`<button type="button" class="option-card ${selected.includes(c)?'active':''} ${!selected.includes(c)&&selected.length>=max?'disabled':''}" data-choice="${name}" data-code="${c}" data-max="${max}" aria-pressed="${selected.includes(c)}"><span class="option-letter">${c}</span><span>${t}</span><span class="check">${selected.includes(c)?'✓':''}</span></button>`).join('')}</div>`}
    function field(name,label,hint='',optional=false,rows=5){const v=answers[name]||'';return `<label class="text-field"><span class="field-label">${label}${optional?'<em>选填</em>':''}</span>${hint?`<span class="field-hint">${hint}</span>`:''}<textarea rows="${rows}" data-field="${name}" placeholder="请写下真实经历或感受……">${esc(v)}</textarea><span class="char-count">${String(v).trim().length} 字</span></label>`}
    function sub(title,note){return `<div class="subheading"><h2>${title}</h2><p>${note}</p></div>`}
    function body(i){
      if(i===0)return `<p class="helper">多选，最多选择 2 项。</p>${choices('focus',2)}${field('focusQuestion','你目前最想弄清楚的问题是：','',false,4)}`;
      if(i===1)return `<p class="helper">暂时不介绍年龄、职业和家庭身份，试着从你此刻的感受出发。</p>${field('selfThree','用哪三句话描述现在的自己？','建议 50—100 字',false,5)}${field('selfImportant','其中哪一句对你最重要？为什么？','',false,4)}`;
      if(i===2)return `<p class="helper">请写 1 件近两年真实发生的事情。可以来自工作、学习、生活、创作、合作或家庭。</p><div class="prompt-box">可以包括：当时的问题、你承担的部分、关键动作、形成的结果，以及别人最认可的能力。</div>${field('abilityEvidence','你的真实经历','建议 100—150 字',false,8)}`;
      if(i===3)return `<p class="helper">多选，最多选择 2 项。</p>${choices('complex',2)}${field('complexCase','请补充一次近期的真实案例','你当时先做了什么，最后依据什么作出决定？',false,6)}`;
      if(i===4)return `${sub('让你更愿意投入的条件','多选，最多选择 3 项。')}${choices('invest',3)}${sub('让你容易失去动力的条件','多选，最多选择 2 项。')}${choices('lose',2)}${field('investExample','一个即使没人催促，你也愿意持续投入的例子','',true,5)}`;
      if(i===5)return `<p class="helper">多选，最多选择 2 项。</p>${choices('pressure',2)}<div class="prompt-box">回想一次近期压力较大的经历：最早出现了什么反应？你做了什么？大约多久恢复？什么真正帮助了你？有没有看似在休息、实际上更累的方式？</div>${field('pressureExperience','你的回答','',false,8)}`;
      if(i===6)return `<p class="helper">请选取一件曾持续三个月以上的事情，可以是工作项目、学习、运动、创作或照顾家庭。</p><div class="prompt-box">可以包括：为什么开始、怎样安排、在哪个阶段卡住、中断后怎样重启、什么反馈让你继续，以及怎样判断完成或值得停止。</div>${field('longTerm','你的长期投入经历','建议 100—150 字',false,9)}`;
      if(i===7)return `${sub('正面评价','多选，最多选择 3 项。')}${choices('positive',3)}${sub('出现摩擦时，他人较常反馈什么？','多选，最多选择 2 项。')}${choices('friction',2)}${field('feedbackExample','一个你认为比较准确的评价或例子','',false,5)}`;
      if(i===8)return `<p class="helper">这里的“重要关系”可以是伴侣、家人、朋友或长期合作伙伴。多选，最多选择 2 项。</p>${choices('relationship',2)}${field('relationshipUnderstand','关系中你最希望对方理解你什么？','',false,4)}${field('relationshipNeed','你最难直接表达的需要是什么？','',false,4)}${field('relationshipSpace','亲近和个人空间发生冲突时，你通常怎样处理？','',false,4)}`;
      return `<p class="helper">它不一定是重大事件，也可以是一段关系、一次选择、一项长期投入或一次失败。</p><div class="prompt-box">可以包括：事情前后你怎样理解自己、什么认识发生了变化、是否仍在影响你，以及未来两三年最希望保留和改变什么。</div>${field('turningPoints','一至两个对你影响较大的转折','选填，建议 100—200 字',true,10)}`;
    }
    function render(){
      if(screen==='welcome')app.innerHTML=`<section class="card"><p class="kicker">把关于你的理解，放回真实生活中核对</p><h1>识己｜现实校准信息表</h1><p class="lead">这不是心理测验，也不会产生人格分数。你提供的真实经历，将帮助报告更贴近你在现实生活中的表现。</p><div class="intro-copy"><p>它只用于核对倾向如何表现、识别已经得到验证的能力，以及重点展开你目前最关心的领域。请根据真实经历作答，不必寻找“正确答案”。</p></div><div class="notice-grid"><div><strong>约 20—30 分钟</strong><span>可以随时退出，稍后继续</span></div><div><strong>10 个主题</strong><span>不舒服的问题可以跳过</span></div><div><strong>本地保存</strong><span>回答不会自动上传服务器</span></div></div><button class="primary hero-button" data-action="start">${answered()?'继续填写':'开始填写'}<span>→</span></button><p class="privacy-note">请不要填写身份证号码、详细住址、账户信息、医疗记录或其他不必要的敏感资料。</p></section>`;
      else if(screen==='form')app.innerHTML=`<section class="card form-card"><div class="progress-row"><span>第 ${step+1} 题，共 10 题</span><span>${(step+1)*10}%</span></div><div class="progress-track"><span style="width:${(step+1)*10}%"></span></div><p class="section-number">${String(step+1).padStart(2,'0')} · ${meta[step][0]}</p><h1>${meta[step][1]}</h1>${body(step)}<div class="form-actions"><button class="text-button" data-action="previous">← 返回</button><button class="primary" data-action="next">${step===9?'检查并导出':'下一题'} <span>→</span></button></div><button class="skip-link" data-action="next">暂时跳过这一题</button></section>`;
      else app.innerHTML=`<section class="card"><p class="kicker">填写完成</p><h1>最后检查一下</h1><p class="lead">答案已保存在当前设备。你可以返回修改，也可以直接导出 Markdown 文件并发送给识己报告操作者。</p><div class="review-list">${meta.map(([l,t],i)=>`<button data-edit="${i}"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${l}</strong><small>${t}</small></div><b>修改</b></button>`).join('')}</div><div class="export-panel"><p>回答不会自动上传。点击下方按钮后，手机会优先调起系统分享；电脑会下载一个 .md 文件。</p><button class="primary export-button" data-action="export">导出填写内容（.md）</button>${notice?`<span class="export-notice">${notice}</span>`:''}</div><div class="review-actions"><button class="text-button" data-action="last">← 返回最后一题</button><button class="danger-link" data-action="clear">清空全部内容</button></div></section>`;
      window.scrollTo({top:0,behavior:'smooth'});
    }
    function lines(v,opts){if(Array.isArray(v)){if(!v.length)return '（未填写）';return v.map(c=>`- ${c}. ${(opts.find(x=>x[0]===c)||[])[1]||c}`).join('\n')}return String(v||'').trim()||'（未填写）'}
    function markdown(){const d=new Intl.DateTimeFormat('zh-CN',{dateStyle:'long'}).format(new Date());return `# 识己｜现实校准信息表\n\n填写日期：${d}\n\n> 本文件由填写者主动导出，仅用于识己报告的现实校准。它不改变已经独立完成的命盘事实与命理底稿。\n\n## 1. 你最希望这份报告重点回应什么？\n\n### 选择\n\n${lines(answers.focus,O.focus)}\n\n### 目前最想弄清楚的问题\n\n${lines(answers.focusQuestion)}\n\n## 2. 现在的你怎样理解自己？\n\n### 用三句话描述现在的自己\n\n${lines(answers.selfThree)}\n\n### 最重要的一句及原因\n\n${lines(answers.selfImportant)}\n\n## 3. 哪项能力已经在现实中得到验证？\n\n${lines(answers.abilityEvidence)}\n\n## 4. 面对复杂或不确定的问题，你通常从哪里开始？\n\n### 选择\n\n${lines(answers.complex,O.complex)}\n\n### 近期真实案例\n\n${lines(answers.complexCase)}\n\n## 5. 什么让你愿意持续投入？\n\n### 更愿意投入的条件\n\n${lines(answers.invest,O.invest)}\n\n### 容易失去动力的条件\n\n${lines(answers.lose,O.lose)}\n\n### 持续投入的例子\n\n${lines(answers.investExample)}\n\n## 6. 压力来临时，你最先出现什么反应？\n\n### 选择\n\n${lines(answers.pressure,O.pressure)}\n\n### 压力经历与恢复过程\n\n${lines(answers.pressureExperience)}\n\n## 7. 你通常怎样把一件事持续做下去？\n\n${lines(answers.longTerm)}\n\n## 8. 别人通常怎样评价你？\n\n### 正面评价\n\n${lines(answers.positive,O.positive)}\n\n### 摩擦反馈\n\n${lines(answers.friction,O.friction)}\n\n### 具体评价或例子\n\n${lines(answers.feedbackExample)}\n\n## 9. 在重要关系中出现分歧时，你通常怎样处理？\n\n### 选择\n\n${lines(answers.relationship,O.relationship)}\n\n### 最希望对方理解什么\n\n${lines(answers.relationshipUnderstand)}\n\n### 最难表达的需要\n\n${lines(answers.relationshipNeed)}\n\n### 亲近与空间冲突时的处理\n\n${lines(answers.relationshipSpace)}\n\n## 10. 哪些经历改变了你对自己的认识？\n\n${lines(answers.turningPoints)}\n\n---\n\n隐私提示：本表不应包含身份证号码、详细住址、账户信息、医疗记录或其他不必要的敏感资料。\n`}
    async function exportMd(){const content=markdown(),date=new Date().toISOString().slice(0,10),name=`识己-现实校准信息-${date}.md`,file=new File([content],name,{type:'text/markdown;charset=utf-8'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'识己｜现实校准信息表',text:'我的识己现实校准信息',files:[file]});notice='已调起系统分享'}else{const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice='Markdown 文件已导出'}render()}catch(e){if(e.name!=='AbortError'){notice='暂时无法导出，请换用系统浏览器重试';render()}}}
    app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice){const n=b.dataset.choice,c=b.dataset.code,m=Number(b.dataset.max),arr=answers[n];answers[n]=arr.includes(c)?arr.filter(x=>x!==c):arr.length<m?[...arr,c]:arr;save();render();return}if(b.dataset.edit!==undefined){step=Number(b.dataset.edit);screen='form';render();return}const a=b.dataset.action;if(a==='start'){screen='form'}else if(a==='next'){if(step<9)step++;else screen='review'}else if(a==='previous'){if(step>0)step--;else screen='welcome'}else if(a==='last'){step=9;screen='form'}else if(a==='export'){exportMd();return}else if(a==='clear'){if(confirm('确定清空当前设备上的全部填写内容吗？此操作无法撤销。')){answers={...blank};localStorage.removeItem(KEY);step=0;screen='welcome'}}render()});
    app.addEventListener('input',e=>{const f=e.target.dataset.field;if(!f)return;answers[f]=e.target.value;save();const c=e.target.parentElement.querySelector('.char-count');if(c)c.textContent=e.target.value.trim().length+' 字'});
    render();
  })();
  </script>
</body>
